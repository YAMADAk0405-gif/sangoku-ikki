<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>三国一騎</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <!-- タイトル -->
    <section id="titleScreen">

        <h1>三国一騎</h1>

        <button id="startButton">
            出陣する
        </button>

    </section>



    <!-- 勢力選択 -->
    <section id="factionScreen" style="display:none;">

        <h2>勢力を選択してください</h2>

        <button class="factionButton" data-faction="魏">魏</button>
        <button class="factionButton" data-faction="蜀">蜀</button>
        <button class="factionButton" data-faction="呉">呉</button>

    </section>



    <!-- 武将選択 -->
    <section id="selectScreen" style="display:none;">

        <h2>代表武将を選んでください</h2>

        <div id="warriorList"></div>

        <br>

        <button id="confirmButton">
            決定
        </button>

        <br>

        <button id="backFactionButton">
        ← 勢力選択へ戻る
        
</button>

    </section>



<!-- 出陣準備 -->
<section id="teamScreen" style="display:none;">

    <h2>出陣準備</h2>

    <h3 id="teamArmy">
    山田軍【魏】
    </h3>

    <h3>
        現在の部隊
    </h3>

    <div id="teamList"></div>

    <div id="teamCost">
        総コスト：0 / 20
    </div>

    <button id="editTeamButton">
        部隊編成
    </button>

    <button id="battleButton">
        一騎打ち開始
    </button>

</section>

<!-- 部隊編成 -->
<section id="teamEditScreen" style="display:none;">

<h2>部隊編成</h2>

<div id="editTeamList"></div>

<div id="editTeamCost">
総コスト：0 / 20
</div>

<p>
部隊編成機能は準備中です
</p>

<button id="completeTeamButton">
完了
</button>

</section>


<!-- 戦闘画面 -->
<section id="battleScreen" style="display:none;">

<h2>⚔ 一騎打ち ⚔</h2>


<div id="battleArea">


<!-- プレイヤー -->

<div class="fighterCard">

    <div class="fighterImage">
        武将画像
    </div>

    <h3 id="playerArmy">
        山田軍【魏】
    </h3>

    <div id="playerInfo"></div>

    <div class="stats" id="playerStats"></div>

</div>



<div class="vs">
    VS
</div>



<!-- 敵 -->

<div class="fighterCard">

    <div class="fighterImage">
        武将画像
    </div>

    <h3 id="enemyArmy">
        曹操軍【魏】
    </h3>

    <div id="enemyInfo"></div>

    <div class="stats" id="enemyStats"></div>

</div>


</div>
<!-- ↑ battleAreaここで終了 -->


<h3>戦闘ログ</h3>

<div id="battleLog"></div>


<button id="nextTurnButton">
次へ
</button>


<button id="restartBattleButton">
再戦する
</button>


<button id="backTitleButton">
トップへ戻る
</button>


</section>
<!-- ↑ battleScreenここで終了 -->

</div>

<script src="warriors.js"></script>
<script src="team.js"></script>
<script src="battle.js"></script>
<script src="ui.js"></script>

</body>

</html>
